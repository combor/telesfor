name: Live providers

# Detect API changes that fixtures cannot catch.
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Providers' channels, guides and streams
    runs-on: ubuntu-latest
    # Five minutes a provider, four at a time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - run: go test -count=1 -timeout 5m -v -run TestLive ./internal/provider/...
        env:
          TELESFOR_LIVE: 1
