name: Live providers

# Detect API changes that fixtures cannot catch.
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Providers' channels, guides and streams
    runs-on: ubuntu-latest
    # Five minutes a provider, and the runner tests four at a time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      # Each TestLive skips what CI cannot check: Globoplay's and WP Pilot's
      # need a telesfor that has signed in, which CI has not.
      - run: go test -count=1 -timeout 5m -v -run TestLive ./internal/provider/...
        env:
          TELESFOR_LIVE: 1
