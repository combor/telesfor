name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ''
          go-version-file: go.mod
          cache: false

  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      # The remux tests skip themselves when ffmpeg cannot make their streams.
      - name: Install ffmpeg for the remux tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -hide_banner -version
          ffmpeg -hide_banner -encoders | grep -w mpeg2video
          ffmpeg -hide_banner -encoders | grep -w mp2
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -cover ./...

  package-smoke:
    name: Package Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A runner per distribution: a service boot shares it with no other.
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      # GoReleaser's Go build cache, under a key of its own: setup-go's key
      # is shared with the test job, whose cache no cross-compilation can use.
      - &restore-goreleaser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: &goreleaser-cache-key go-build-goreleaser-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-goreleaser-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Build the packages
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: &goreleaser-version v2.18.2
          args: release --snapshot --clean --skip=nix
      # The service fetches its channels from TVP as it starts. The pass is
      # asserted: a leg whose name drifted from the Go test's distros table
      # would otherwise go green having run nothing.
      - name: Install and run the package as a systemd service
        shell: bash
        env:
          TELESFOR_SMOKE_DIST: ${{ github.workspace }}/dist
        run: |
          go test -count=1 -timeout 20m -run '^TestPackageService$/^${{ matrix.distro }}$' -v ./cmd/telesfor | tee smoke.out
          grep -q -- '--- PASS: TestPackageService/${{ matrix.distro }}' smoke.out
      # One leg saves for the three: the builds are identical, and the shared
      # key takes one save.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.distro == 'debian'
        with:
          path: ~/.cache/go-build
          key: *goreleaser-cache-key

  container-smoke:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: telesfor:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # After the build, which prints the commit message: setup-go reports a
      # line that names a Go file there as a compiler error.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      # The container fetches its channels from TVP as it starts.
      - name: Start the image and ask for its lineup
        env:
          TELESFOR_SMOKE_IMAGE: telesfor:ci
        run: go test -count=1 -run TestContainerServesLineup ./cmd/telesfor

  release:
    name: Release
    needs: &release-checks
      - govulncheck
      - test
      - package-smoke
      - container-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs previous tags.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      # Filled by the smoke test's identical build: see its cache steps.
      - *restore-goreleaser-cache
      - name: Prepare RPM signing key
        env:
          RPM_GPG_PRIVATE_KEY: ${{ secrets.RPM_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$RPM_GPG_PRIVATE_KEY" ]; then
            echo "RPM_GPG_PRIVATE_KEY is not configured"
            exit 1
          fi
          umask 077
          printf '%s\n' "$RPM_GPG_PRIVATE_KEY" > "$RUNNER_TEMP/rpm-signing-private.asc"
      # GoReleaser uses nix-hash to generate the Nix package.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: *goreleaser-version
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_KEY_PATH: ${{ runner.temp }}/rpm-signing-private.asc
          AUR_KEY: ${{ secrets.AUR_KEY }}
          # Tokens need contents:write on the package repositories.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
          NUR_GITHUB_TOKEN: ${{ secrets.NUR_GITHUB_TOKEN }}

  publish-container:
    name: Publish Container Image
    # Gated on the checks, not on the release: the image publishes beside
    # it, and stays published if the release fails.
    needs: *release-checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installing ffmpeg in the arm64 runtime requires emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/combor/telesfor
          # Prereleases must not move latest.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          # The repository supplies the other labels, but no description.
          labels: &description |
            org.opencontainers.image.description=A virtual TV tuner for Plex: live TV from streaming providers as an HDHomeRun network tuner.
          annotations: *description
        env:
          # GHCR reads a multi-platform image's description from its index.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          # No cache-to: the smoke test has already written this tag's cache.
          cache-from: type=gha
      - name: Verify the published image is public
        env:
          IMAGE: ghcr.io/combor/telesfor@${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          if ! index=$(docker buildx imagetools inspect --raw "$IMAGE"); then
            echo "anonymous pull denied: set the GHCR package to public in its settings, then re-run this job"
            exit 1
          fi
          published=$(jq -r '[.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(" ")' <<<"$index")
          echo "published: $published"
          [ "$published" = "linux/amd64 linux/arm64" ] || exit 1
